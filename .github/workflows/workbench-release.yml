name: Package workbench preview
on:
  push:
    tags: ['workbench-v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/WorkbenchTests -c Release -- .
      - run: ./scripts/Build-Workbench.ps1
      - name: Publish workbench prerelease without replacing the translation update channel
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$env:RELEASE_TAG" .local/dist/TSKHook-UITranslations-win-x64.zip --verify-tag --prerelease --latest=false --generate-notes
