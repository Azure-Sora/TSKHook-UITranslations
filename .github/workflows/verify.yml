name: Verify workbench
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/WorkbenchTests -c Release -- .
      - run: dotnet build app/Workbench -c Release
      - run: dotnet run --project tools/GenerateSkillPlainText -c Release -- --self-test
      - run: dotnet run --project tools/CompileUiRuntime -c Release -- . .local/ci/ui_translations.jsonl
